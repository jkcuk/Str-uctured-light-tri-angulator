<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Projector Profilometry</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:Arial,sans-serif;
}

#ui{
    position:absolute;
    top:10px;
    left:10px;
    z-index:100;
    background:rgba(0,0,0,0.6);
    padding:10px;
    border-radius:8px;
}

button{
    padding:8px 12px;
    margin-right:6px;
}

#videoPanel{
    position:absolute;
    right:10px;
    bottom:10px;
    width:320px;
    height:240px;
    z-index:100;
    border:2px solid white;
}

#video{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
}

#overlay{
    position:absolute;
    width:100%;
    height:100%;
    pointer-events:none;
}

#status{
    color:white;
    margin-top:6px;
    font-size:13px;
}

</style>
</head>
<body>

<div id="ui">

<button id="calibrate">
Calibrate
</button>

<button id="profile">
Profilometry Mode
</button>

<div id="status">
Loading OpenCV...
</div>

</div>

<div id="videoPanel">

<video
id="video"
autoplay
playsinline>
</video>

<canvas id="overlay"></canvas>

</div>

<script async
src="https://docs.opencv.org/4.x/opencv.js">
</script>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.163/build/three.module.js";

///////////////////////////////////////////////////////////////////////////
// UI
///////////////////////////////////////////////////////////////////////////

const statusText =
document.getElementById("status");

const video =
document.getElementById("video");

const overlay =
document.getElementById("overlay");

const overlayCtx =
overlay.getContext("2d");

///////////////////////////////////////////////////////////////////////////
// OPENCV READY
///////////////////////////////////////////////////////////////////////////

function waitForOpenCV()
{
    return new Promise(resolve =>
    {
        const check = () =>
        {
            if(window.cv && cv.Mat)
            {
                resolve();
            }
            else
            {
                requestAnimationFrame(check);
            }
        };

        check();
    });
}

await waitForOpenCV();

statusText.innerHTML =
"OpenCV loaded";

///////////////////////////////////////////////////////////////////////////
// CAMERA
///////////////////////////////////////////////////////////////////////////

const stream =
await navigator.mediaDevices.getUserMedia({
    video:{
        facingMode:"environment"
    }
});

video.srcObject = stream;

await video.play();

///////////////////////////////////////////////////////////////////////////
// HIDDEN PROCESSING CANVAS
///////////////////////////////////////////////////////////////////////////

const captureCanvas =
document.createElement("canvas");

const captureCtx =
captureCanvas.getContext("2d");

///////////////////////////////////////////////////////////////////////////
// THREE.JS
///////////////////////////////////////////////////////////////////////////

const scene = new THREE.Scene();

scene.background =
new THREE.Color(0x000000);

const camera =
new THREE.PerspectiveCamera(
    60,
    window.innerWidth/window.innerHeight,
    0.01,
    100
);

camera.position.set(0,0,3);

const renderer =
new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document.body.appendChild(
    renderer.domElement
);

///////////////////////////////////////////////////////////////////////////
// POINT CLOUD
///////////////////////////////////////////////////////////////////////////

const geometry =
new THREE.BufferGeometry();

const material =
new THREE.PointsMaterial({
    color:0x00ffcc,
    size:0.02
});

const cloud =
new THREE.Points(
    geometry,
    material
);

scene.add(cloud);

///////////////////////////////////////////////////////////////////////////
// STATE
///////////////////////////////////////////////////////////////////////////

let calibrationDots = [];
let profilometryMode = false;

///////////////////////////////////////////////////////////////////////////
// CAPTURE FRAME
///////////////////////////////////////////////////////////////////////////

function captureFrame()
{
    captureCanvas.width =
        video.videoWidth;

    captureCanvas.height =
        video.videoHeight;

    captureCtx.drawImage(
        video,
        0,
        0
    );

    return captureCtx.getImageData(
        0,
        0,
        captureCanvas.width,
        captureCanvas.height
    );
}

///////////////////////////////////////////////////////////////////////////
// SUBPIXEL BLOB DETECTION
///////////////////////////////////////////////////////////////////////////

function detectDotsCV(imageData)
{
    let src =
        cv.matFromImageData(
            imageData
        );

    let gray =
        new cv.Mat();

    let blur =
        new cv.Mat();

    let thresh =
        new cv.Mat();

    cv.cvtColor(
        src,
        gray,
        cv.COLOR_RGBA2GRAY
    );

    cv.GaussianBlur(
        gray,
        blur,
        new cv.Size(5,5),
        0
    );

    cv.adaptiveThreshold(
        blur,
        thresh,
        255,
        cv.ADAPTIVE_THRESH_GAUSSIAN_C,
        cv.THRESH_BINARY,
        35,
        -5
    );

    let contours =
        new cv.MatVector();

    let hierarchy =
        new cv.Mat();

    cv.findContours(
        thresh,
        contours,
        hierarchy,
        cv.RETR_LIST,
        cv.CHAIN_APPROX_SIMPLE
    );

    let dots = [];

    for(let i=0;i<contours.size();i++)
    {
        let cnt =
            contours.get(i);

        const area =
            cv.contourArea(cnt);

        if(area < 5 || area > 500)
        {
            cnt.delete();
            continue;
        }

        const m =
            cv.moments(cnt);

        if(m.m00 === 0)
        {
            cnt.delete();
            continue;
        }

        let cx =
            m.m10/m.m00;

        let cy =
            m.m01/m.m00;

        dots.push({
            x:cx,
            y:cy
        });

        cnt.delete();
    }

    if(dots.length)
    {
        let corners =
            new cv.Mat(
                dots.length,
                1,
                cv.CV_32FC2
            );

        for(let i=0;i<dots.length;i++)
        {
            corners.data32F[
                i*2
            ] = dots[i].x;

            corners.data32F[
                i*2+1
            ] = dots[i].y;
        }

        cv.cornerSubPix(
            gray,
            corners,
            new cv.Size(5,5),
            new cv.Size(-1,-1),
            new cv.TermCriteria(
                cv.TermCriteria_EPS +
                cv.TermCriteria_MAX_ITER,
                20,
                0.01
            )
        );

        for(let i=0;i<dots.length;i++)
        {
            dots[i].x =
                corners.data32F[
                i*2];

            dots[i].y =
                corners.data32F[
                i*2+1];
        }

        corners.delete();
    }

    src.delete();
    gray.delete();
    blur.delete();
    thresh.delete();
    contours.delete();
    hierarchy.delete();

    return dots;
}

///////////////////////////////////////////////////////////////////////////
// DEBUG DISPLAY
///////////////////////////////////////////////////////////////////////////

function drawDots(dots)
{
    const w =
        overlay.width =
        overlay.clientWidth;

    const h =
        overlay.height =
        overlay.clientHeight;

    overlayCtx.clearRect(
        0,0,w,h
    );

    const sx =
        w/captureCanvas.width;

    const sy =
        h/captureCanvas.height;

    overlayCtx.strokeStyle =
        "lime";

    overlayCtx.lineWidth = 2;

    for(const d of dots)
    {
        overlayCtx.beginPath();

        overlayCtx.arc(
            d.x*sx,
            d.y*sy,
            4,
            0,
            Math.PI*2
        );

        overlayCtx.stroke();
    }
}

///////////////////////////////////////////////////////////////////////////
// DEPTH MODEL
///////////////////////////////////////////////////////////////////////////

function estimateDepth(disparity)
{
    const baseline = 0.10;
    const focal = 1200;

    return (
        baseline*focal
    ) /
    Math.max(
        disparity,
        1
    );
}

///////////////////////////////////////////////////////////////////////////
// POINT CLOUD
///////////////////////////////////////////////////////////////////////////

function buildPointCloud(currentDots)
{
    const positions = [];

    const n =
    Math.min(
        calibrationDots.length,
        currentDots.length
    );

    for(let i=0;i<n;i++)
    {
        const a =
            calibrationDots[i];

        const b =
            currentDots[i];

        const dx =
            b.x-a.x;

        const dy =
            b.y-a.y;

        const disparity =
            Math.sqrt(
                dx*dx +
                dy*dy
            );

        const z =
            estimateDepth(
                disparity
            );

        const scale =
            0.002;

        positions.push(
            (b.x -
            captureCanvas.width/2)
            * scale,

            -(b.y -
            captureCanvas.height/2)
            * scale,

            -z*0.01
        );
    }

    geometry.setAttribute(
        "position",

        new THREE.Float32BufferAttribute(
            positions,
            3
        )
    );

    geometry.computeBoundingSphere();
}

///////////////////////////////////////////////////////////////////////////
// BUTTONS
///////////////////////////////////////////////////////////////////////////

document
.getElementById("calibrate")
.onclick = () =>
{
    const frame =
        captureFrame();

    calibrationDots =
        detectDotsCV(
            frame
        );

    statusText.innerHTML =
        "Calibration dots: " +
        calibrationDots.length;
};

document
.getElementById("profile")
.onclick = () =>
{
    profilometryMode = true;
};

///////////////////////////////////////////////////////////////////////////
// ANIMATION
///////////////////////////////////////////////////////////////////////////

function animate()
{
    requestAnimationFrame(
        animate
    );

    if(video.readyState >= 2)
    {
        const frame =
            captureFrame();

        const dots =
            detectDotsCV(
                frame
            );

        drawDots(dots);

        if(profilometryMode)
        {
            buildPointCloud(
                dots
            );
        }
    }

    cloud.rotation.y +=
        0.003;

    renderer.render(
        scene,
        camera
    );
}

animate();

///////////////////////////////////////////////////////////////////////////

window.addEventListener(
"resize",
() =>
{
    camera.aspect =
        window.innerWidth /
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
}
);

</script>
</body>
</html>
