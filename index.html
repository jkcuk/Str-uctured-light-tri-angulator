<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Projector Profilometry</title>

<script async src="https://docs.opencv.org/4.x/opencv.js"></script>

<style>
body{margin:0;overflow:hidden;background:#000;color:#fff;font-family:Arial}
#ui{position:absolute;left:10px;top:10px;z-index:20;background:rgba(0,0,0,.7);padding:10px;border-radius:8px}
#videoPanel{position:absolute;right:10px;bottom:10px;width:320px;height:240px;border:2px solid white;z-index:30}
#video,#overlay{position:absolute;width:100%;height:100%}
button{padding:8px;margin-right:4px}
</style>
</head>
<body>
<div id="ui">
<button id="calibrate">Calibrate</button>
<button id="profile">Profilometry</button>
<div id="status">Loading...</div>
</div>
<div id="videoPanel">
<video id="video" autoplay playsinline></video>
<canvas id="overlay"></canvas>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.163/build/three.module.js';

const status=document.getElementById('status');
const video=document.getElementById('video');
const overlay=document.getElementById('overlay');
const octx=overlay.getContext('2d');

while(!(window.cv && cv.Mat)){
  await new Promise(r=>setTimeout(r,100));
}
status.textContent='OpenCV Ready';

const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
video.srcObject=stream;
await video.play();

const capCanvas=document.createElement('canvas');
const capCtx=capCanvas.getContext('2d');

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.01,100);
camera.position.z=3;
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

const geometry=new THREE.BufferGeometry();
const points=new THREE.Points(
 geometry,
 new THREE.PointsMaterial({size:0.02,color:0x00ffcc})
);
scene.add(points);

let calibrationDB=[];
let profiling=false;

function capture(){
 capCanvas.width=video.videoWidth;
 capCanvas.height=video.videoHeight;
 capCtx.drawImage(video,0,0);
 return capCtx.getImageData(0,0,capCanvas.width,capCanvas.height);
}

function detectDotsCV(imageData){
 const src=cv.matFromImageData(imageData);
 const gray=new cv.Mat();
 const blur=new cv.Mat();
 const thresh=new cv.Mat();
 cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);
 cv.GaussianBlur(gray,blur,new cv.Size(5,5),0);
 cv.adaptiveThreshold(blur,thresh,255,cv.ADAPTIVE_THRESH_GAUSSIAN_C,cv.THRESH_BINARY,35,-5);
 const labels=new cv.Mat();
 const stats=new cv.Mat();
 const centroids=new cv.Mat();
 const n=cv.connectedComponentsWithStats(thresh,labels,stats,centroids,8,cv.CV_32S);
 const dots=[];
 for(let i=1;i<n;i++){
  const area=stats.intAt(i,cv.CC_STAT_AREA);
  if(area<5||area>500) continue;
  dots.push({x:centroids.doubleAt(i,0),y:centroids.doubleAt(i,1)});
 }
 [src,gray,blur,thresh,labels,stats,centroids].forEach(m=>m.delete());
 return dots;
}

function createDescriptor(dot,dots,k=6){
 const n=[];
 for(const d of dots){
  if(d===dot) continue;
  const dx=d.x-dot.x, dy=d.y-dot.y;
  n.push({dist:Math.hypot(dx,dy),angle:Math.atan2(dy,dx)});
 }
 n.sort((a,b)=>a.dist-b.dist);
 const sel=n.slice(0,k);
 if(sel.length===0) return [];
 const d0=sel[0].dist;
 return sel.map(v=>({dist:v.dist/d0,angle:v.angle}));
}

function buildDatabase(dots){
 return dots.map((d,i)=>({id:i,x:d.x,y:d.y,descriptor:createDescriptor(d,dots)}));
}

function descriptorDistance(a,b){
 const n=Math.min(a.length,b.length);
 let s=0;
 for(let i=0;i<n;i++){
  s+=Math.abs(a[i].dist-b[i].dist);
  let da=Math.abs(a[i].angle-b[i].angle);
  da=Math.min(da,Math.PI*2-da);
  s+=0.2*da;
 }
 return s;
}

function matchDots(obs){
 const matches=[];
 for(const d of obs){
  const desc=createDescriptor(d,obs);
  let best=null,bestScore=1e9;
  for(const ref of calibrationDB){
   const sc=descriptorDistance(desc,ref.descriptor);
   if(sc<bestScore){bestScore=sc;best=ref;}
  }
  if(best && bestScore<2){
   matches.push({calibration:best,current:d});
  }
 }
 return matches;
}

function estimateDepth(disparity){
 return (0.1*1200)/Math.max(disparity,1);
}

function rebuildCloud(current){
 const matches=matchDots(current);
 const pos=[];
 for(const m of matches){
  const dx=m.current.x-m.calibration.x;
  const dy=m.current.y-m.calibration.y;
  const disp=Math.hypot(dx,dy);
  const z=estimateDepth(disp);
  pos.push(
   (m.current.x-capCanvas.width/2)*0.002,
   -(m.current.y-capCanvas.height/2)*0.002,
   -z*0.01
  );
 }
 geometry.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
 }

function drawDots(dots){
 overlay.width=overlay.clientWidth;
 overlay.height=overlay.clientHeight;
 octx.clearRect(0,0,overlay.width,overlay.height);
 const sx=overlay.width/capCanvas.width;
 const sy=overlay.height/capCanvas.height;
 octx.strokeStyle='lime';
 for(const d of dots){
  octx.beginPath();
  octx.arc(d.x*sx,d.y*sy,4,0,Math.PI*2);
  octx.stroke();
 }
}

document.getElementById('calibrate').onclick=()=>{
 const dots=detectDotsCV(capture());
 calibrationDB=buildDatabase(dots);
 status.textContent=`Stored ${calibrationDB.length} descriptors`;
};

document.getElementById('profile').onclick=()=>profiling=true;

function animate(){
 requestAnimationFrame(animate);
 if(video.readyState>=2){
  const dots=detectDotsCV(capture());
  drawDots(dots);
  if(profiling && calibrationDB.length) rebuildCloud(dots);
 }
 points.rotation.y+=0.003;
 renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
